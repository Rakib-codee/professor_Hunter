name: Keep-alive

# Free Supabase projects pause after 7 days without activity (PLAN.md §3). Hitting the health
# endpoint runs a query and keeps the project awake. Set SITE_URL as a repository variable.
on:
  schedule:
    - cron: '0 6 * * 1,4' # Mondays and Thursdays 06:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check SITE_URL is configured
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::error::SITE_URL repository variable is not set. Add it under Settings → Secrets and variables → Actions → Variables (e.g. https://professor-hunter.vercel.app)."
            exit 1
          fi
          echo "SITE_URL is set to $SITE_URL"

      - name: Call /api/health
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          url="${SITE_URL%/}/api/health"
          body=$(curl --fail --silent --show-error --max-time 30 "$url")
          echo "$body"
          echo "$body" | grep -q '"ok":true'
