name: Keep-alive

# Free Supabase projects pause after 7 days without activity (PLAN.md §3). Hitting the health
# endpoint runs a query and keeps the project awake. Set SITE_URL as a repository variable.
on:
  schedule:
    - cron: '0 6 * * 1,4' # Mondays and Thursdays 06:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/health
        run: |
          url="${{ vars.SITE_URL }}/api/health"
          body=$(curl --fail --silent --show-error --max-time 30 "$url")
          echo "$body"
          echo "$body" | grep -q '"ok":true'
